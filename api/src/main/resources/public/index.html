<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 0.5rem 0 0 0;
            color: #c7d2fe;
            font-size: 1.1rem;
        }

        .dashboard-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: -2rem;
            padding: 0 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 150px;
        }

        .stat-card h2 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--primary);
        }

        .stat-card p {
            margin: 0;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .filters {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            align-items: center;
        }

        .search-bar {
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            width: 300px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .item-id {
            background: #f3f4f6;
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-available {
            background: #d1fae5;
            color: #065f46;
        }

        .status-assigned {
            background: #fee2e2;
            color: #991b1b;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            line-height: 1.3;
        }

        .card-category {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-category::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }

        .action-btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.2s;
        }

        .btn-checkout {
            background-color: var(--primary);
            color: white;
        }

        .btn-checkout:hover {
            background-color: var(--primary-hover);
        }

        .btn-return {
            background-color: #f3f4f6;
            color: var(--text-main);
            border: 1px solid #d1d5db;
        }

        .btn-return:hover {
            background-color: #e5e7eb;
        }

        /* Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal {
            background: white; padding: 2rem; border-radius: 12px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2);
        }
        .modal h2 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }
        
        .btn-add-new {
            background-color: var(--success); color: white; border: none;
            padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background 0.2s;
        }
        .btn-add-new:hover { background-color: #059669; }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--success);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        #toast.show {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>Studio Manager Pro</h1>
        <p>Enterprise-grade equipment tracking and assignment</p>
    </header>

    <div class="dashboard-stats">
        <div class="stat-card">
            <h2 id="stat-total">0</h2>
            <p>Total Assets</p>
        </div>
        <div class="stat-card">
            <h2 id="stat-available" style="color: var(--success)">0</h2>
            <p>Available Now</p>
        </div>
        <div class="stat-card">
            <h2 id="stat-assigned" style="color: var(--danger)">0</h2>
            <p>Checked Out</p>
        </div>
    </div>

    <div class="container">
        <div class="filters">
            <div style="display:flex; align-items:center; gap: 1rem;">
                <h2 style="margin:0;">Equipment Roster</h2>
                <button class="btn-add-new" onclick="document.getElementById('addModal').style.display='flex'">+ Add Equipment</button>
            </div>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search by name, ID, or category..." onkeyup="filterInventory()">
        </div>

        <div class="grid" id="inventory-grid">
            <!-- Cards will be injected here -->
        </div>
    </div>

    <!-- Add Equipment Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>Add Custom Equipment</h2>
            <div class="form-group">
                <label>Equipment ID (e.g., LGT-01)</label>
                <input type="text" id="newId" placeholder="Unique ID">
            </div>
            <div class="form-group">
                <label>Equipment Name</label>
                <input type="text" id="newName" placeholder="e.g. Ring Light">
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="newCategory" placeholder="e.g. Lighting">
            </div>
            <div class="modal-actions">
                <button class="btn-return" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
                <button class="btn-checkout" onclick="submitNewEquipment()">Add Item</button>
            </div>
        </div>
    </div>

    <div id="toast">Action Successful!</div>

    <script>
        let globalInventory = [];

        async function fetchInventory() {
            const response = await fetch('/api/inventory');
            globalInventory = await response.json();
            renderInventory();
            updateStats();
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = globalInventory.length;
            const available = globalInventory.filter(item => !item.isAssigned).length;
            document.getElementById('stat-available').innerText = available;
            document.getElementById('stat-assigned').innerText = globalInventory.length - available;
        }

        function renderInventory(filterText = "") {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';

            const filteredData = globalInventory.filter(item => 
                item.name.toLowerCase().includes(filterText) || 
                item.category.toLowerCase().includes(filterText) ||
                item.id.toLowerCase().includes(filterText)
            );

            filteredData.forEach(item => {
                const isAssigned = item.isAssigned;
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="item-id">${item.id}</span>
                        <span class="status-badge ${isAssigned ? 'status-assigned' : 'status-available'}">
                            ${isAssigned ? 'Checked Out' : 'Available'}
                        </span>
                    </div>
                    <h3 class="card-title">${item.name}</h3>
                    <div class="card-category">${item.category}</div>
                    
                    <button class="action-btn ${isAssigned ? 'btn-return' : 'btn-checkout'}" onclick="toggleStatus('${item.id}', '${item.name}')">
                        ${isAssigned ? 'Return to Studio' : 'Checkout Equipment'}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function filterInventory() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderInventory(query);
        }

        async function toggleStatus(id, name) {
            await fetch(`/api/toggle?id=${id}`, { method: 'POST' });
            showToast(`Successfully updated status for ${name}`);
            fetchInventory(); // Refresh data
            
            // Keep search filter active after click
            setTimeout(filterInventory, 50); 
        }

        async function submitNewEquipment() {
            const id = document.getElementById('newId').value.trim();
            const name = document.getElementById('newName').value.trim();
            const category = document.getElementById('newCategory').value.trim();

            if(!id || !name || !category) {
                alert("Please fill in all fields!");
                return;
            }

            const payload = { id: id, name: name, category: category };
            
            const response = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                showToast(`Added ${name} to inventory!`);
                document.getElementById('addModal').style.display = 'none';
                
                // Clear form
                document.getElementById('newId').value = '';
                document.getElementById('newName').value = '';
                document.getElementById('newCategory').value = '';
                
                fetchInventory(); // Refresh grid
            } else {
                const errorMsg = await response.text();
                alert(errorMsg);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initial Load
        fetchInventory();
    </script>
</body>
</html>
